[workspace]
members = [
    "crates/bmtop-core",
    "crates/bmtop-macos",
    "crates/bmtop-tui",
    "crates/bmtop",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/BetterMacNet/bmtop"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = { version = "0.29", features = ["event-stream"] }
libc = "0.2"
plist = "1"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
unicode-width = "0.2"
